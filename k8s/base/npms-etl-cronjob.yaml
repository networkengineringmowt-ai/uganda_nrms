# NPMS pavement data engine — nightly ETL refreshing pms_dashboard.json
# Adjust the volume hostPath to where the ugnrms repo lives on the server.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: npms-data-engine
  namespace: nrms
spec:
  schedule: "0 2 * * *"          # 02:00 EAT nightly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: python:3.12-slim
              command: ["/bin/sh","-c"]
              # scripts/pavement_data_engine.py hard-imports numpy, openpyxl, pypdf,
              # python-docx (import name "docx") and scikit-learn (import name
              # "sklearn") - none of those except openpyxl were being installed here,
              # and pandas (which WAS installed) isn't imported anywhere in the
              # script. Every nightly run was failing on `import numpy as np` before
              # doing any work. pyodbc stays out - the script already treats it as
              # optional (try/except ImportError) and it needs system ODBC libs this
              # slim image doesn't have.
              args:
                - pip install --quiet numpy openpyxl pypdf python-docx scikit-learn && python /repo/scripts/pavement_data_engine.py
              volumeMounts:
                - { name: repo, mountPath: /repo }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits:   { cpu: "1",  memory: 2Gi }
          volumes:
            - name: repo
              hostPath: { path: /srv/ugnrms, type: Directory }
