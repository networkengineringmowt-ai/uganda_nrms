name: Uptime Check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site uptime
        run: |
          URL="https://networkengineringmowt-ai.github.io/${{ github.event.repository.name }}/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Site: $URL"
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Site returned $STATUS"
            exit 1
          fi
          echo "OK: Site is up"
